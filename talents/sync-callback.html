<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Retour synchronisation</title>
</head>
<body>
  <p id="status">Réception de la réponse...</p>

  <script>
    const status = document.querySelector("#status");
    const params = new URLSearchParams(window.location.search);
    const syncResponse = params.get("sync");

    try {
      if (!syncResponse) {
        throw new Error("Aucune réponse reçue depuis Apps Script.");
      }

      const response = JSON.parse(syncResponse);

      status.textContent = "Réponse reçue. Transmission à la page principale...";

      window.parent.postMessage(
        response,
        "https://sixtinerpg.github.io"
      );

      status.textContent = "Réponse transmise.";
    } catch (error) {
      status.textContent = `Erreur : ${error.message}`;

      window.parent.postMessage(
        {
          success: false,
          message: error.message
        },
        "https://sixtinerpg.github.io"
      );
    }
  </script>
</body>
</html>
